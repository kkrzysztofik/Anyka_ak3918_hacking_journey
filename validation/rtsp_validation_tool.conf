# RTSP validation tool configuration
# Source this file or export variables before running rtsp_validation_tool.sh

# RTSP connection parameters
RTSP_HOST="127.0.0.1"
RTSP_PORT=554
RTSP_STREAM="/vs0"
RTSP_TIMEOUT=10

# Packet capture interface for tshark.
# - For localhost tests, "lo" is typical.
# - For remote cameras, consider "any" or your outbound interface (e.g. eth0/wlan0).
CAPTURE_IFACE=""

# Test durations
SHORT_TEST_DURATION=30
LONG_TEST_DURATION=600
CONCURRENT_CLIENT_COUNT=4

# Performance thresholds
VIDEO_STARTUP_LATENCY_MS=1500
AUDIO_STARTUP_LATENCY_MS=2000
BITRATE_TOLERANCE_PERCENT=15
FPS_TOLERANCE_PERCENT=10
PACKET_LOSS_TOLERANCE_PERCENT=1
AV_SYNC_DRIFT_MS=200

# Expected values for bitrate/FPS validation (optional; used with tolerances above)
# If unset, baseline comparison (--compare-baseline) is used when available.
EXPECTED_BITRATE="${EXPECTED_BITRATE:-}"
EXPECTED_FPS="${EXPECTED_FPS:-}"

# Regression detection
REGRESSION_ENABLED=true
REGRESSION_TOLERANCE_PERCENT=10
# Baseline directory is determined by `rtsp_validation_tool.sh` by default:
# `${SCRIPT_DIR}/rtsp_results/baselines`.
# You can override it by exporting BASELINE_DIR before running the script.
# BASELINE_DIR=""

# Logging
LOG_LEVEL="info"
LOG_FILE="rtsp_validation.log"
