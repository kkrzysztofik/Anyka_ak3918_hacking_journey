# RTSP validation tool configuration
# Run with: rtsp_validation_tool   (uses this file via env or search path)
# Or:      rtsp_validation_tool --config /path/to/rtsp_validation.toml
# CLI args override config.

# -----------------------------------------------------------------------------
# Run mode: how to get an RTSP server (config-only run needs one of these)
# -----------------------------------------------------------------------------
[run]
# Connect to existing server (no local/device launch)
no-launch = false
# Start onvif-rust on the device via telnet (implies no-launch)
launch-on-device = true
# For local launch only (no-launch=false, launch-on-device=false): path to H.264 file
# h264-file = "test_video.h264"
# Output report path
output = "rtsp_validation.json"
# Update baseline files from this run
update-baseline = false
# Compare against baselines and fail on regression
compare-baseline = false

# -----------------------------------------------------------------------------
# RTSP endpoint (used when no_launch; host/port/stream when launch_on_device come from [device])
# -----------------------------------------------------------------------------
[rtsp]
host = "192.168.2.198"
port = 554
stream = "/stream1"
timeout-sec = 10

[test]
short-duration-sec = 30
long-duration-sec = 600
concurrent-clients = 4

[thresholds]
video-startup-latency-ms = 1500
audio-startup-latency-ms = 2000
bitrate-tolerance-percent = 15
fps-tolerance-percent = 10
packet-loss-tolerance-percent = 1

# Optional expected values; if unset, baseline comparison used when available
# [thresholds.expected]
# bitrate_kbps = 2000
# fps = 25

[baseline]
dir = "rtsp_results/baselines"

[capture]
# Empty = auto (lo for localhost, any for remote)
interface = ""

[logging]
level = "debug"
# Retina RTSP client library level (e.g. "debug", "trace"). Omit or leave empty to use level above.
retina-level = "debug"
file = "rtsp_validation.log"
ffmpeg-level = "debug"

[artifacts]
# Root directory where the tool writes per-run artifacts:
# - ffmpeg/ffprobe/tshark stdout/stderr logs
# - pcap captures (kept by default)
dir = "rtsp_results/runs"
capture-tool-output = true
keep-pcaps = true

# Device (camera) validation: telnet and telemetry when using launch-on-device
[device]
host = "192.168.2.198"
telnet-port = 24
telemetry = true
# Paths on device for H.264/AAC validation mode (device binary must be built with validation-mode)
h264-file = "/mnt/anyka_hack/onvif/test.h264"
aac-file = "/mnt/anyka_hack/onvif/test_audio.aac"
loop-playback = true
