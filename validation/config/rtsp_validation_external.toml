# RTSP validation tool configuration — External Server
#
# Validates an RTSP server that is already running elsewhere (e.g. MediaMTX):
# nothing is launched locally or on the device.
#
# Usage:
#   rtsp_validation_tool -c validation/config/rtsp_validation_external.toml
#
# Only overrides are listed here. Anything omitted uses the built-in default —
# see rtsp_validation.toml for the fully annotated template.

[run]
# Connect to an already-running server.
no-launch = true

[rtsp]
host = "192.168.2.99"
port = 8554
stream = "/mystream"
# Optional stream credentials used for BOTH RTSP and HTTP-FLV checks.
# username = "admin"
# password = "www123"

[thresholds]
# Default is 0, i.e. audio startup latency is recorded but not checked.
audio-startup-latency-ms = 2000

# Optional expected values; baseline comparison is used when these are unset.
# [thresholds.expected]
# bitrate_kbps = 2000
# fps = 25

[logging]
level = "debug"
# Retina RTSP client library level. Omit to reuse `level` above.
retina-level = "debug"
file = "rtsp_validation.log"
ffmpeg-level = "debug"

[device]
# Only consulted if you flip no-launch off and drive the device instead.
h264-file = "/mnt/anyka_hack/onvif/test.h264"
aac-file = "/mnt/anyka_hack/onvif/test_audio.aac"
loop-playback = true
