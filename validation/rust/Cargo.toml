[package]
name = "rtsp-validation-tool"
version = "0.1.0"
edition = "2024"
description = "Host-side RTSP protocol conformance validator for Anyka"
license = "MIT OR Apache-2.0"

[lib]
name = "rtsp_validation_tool"
path = "src/lib.rs"

[[bin]]
name = "rtsp_validation_tool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ffmpeg-sidecar = "2"
ffprobe = "0.4"
futures-util = "0.3"
retina = "0.4.15"
rtshark = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
telnet = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

