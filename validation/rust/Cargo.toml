[package]
name = "rtsp-validation-tool"
version = "0.1.0"
edition = "2024"
description = "Host-side RTSP protocol conformance validator for Anyka"
license = "MIT OR Apache-2.0"

[lib]
name = "rtsp_validation_tool"
path = "src/lib.rs"

[[bin]]
name = "rtsp_validation_tool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ffmpeg-sidecar = "2"
futures-util = "0.3"
retina = "0.4.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9.6"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
] }
toml = "1.1"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
