name: Shared Reporting

on:
  workflow_call:
    inputs:
      project_type:
        required: true
        type: string
      test_coverage:
        required: false
        type: string
      snyk_code_status:
        required: false
        type: string
        default: "skipped"
      snyk_oss_status:
        required: false
        type: string
        default: "skipped"
      snyk_issues:
        required: false
        type: string
        default: "0"
      sonar_scan_status:
        required: false
        type: string
        default: "skipped"
      quality_gate_status:
        required: false
        type: string
        default: "skipped"

jobs:
  generate-summary:
    name: Generate CI Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Run Summary
        env:
          SNYK_CODE_STATUS_INPUT: ${{ inputs.snyk_code_status }}
          SNYK_OSS_STATUS_INPUT: ${{ inputs.snyk_oss_status }}
          SONAR_SCAN_STATUS_INPUT: ${{ inputs.sonar_scan_status }}
          QUALITY_GATE_STATUS_INPUT: ${{ inputs.quality_gate_status }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          TEST_COVERAGE: ${{ inputs.test_coverage || 'N/A' }}
          SNYK_ISSUES: ${{ inputs.snyk_issues || '0' }}
        run: |
          # Helper function to get status emoji
          get_status() {
            case "$1" in
              success) echo "✅ Completed" ;;
              failure) echo "⚠️ Failed" ;;
              *) echo "⚠️ Skipped" ;;
            esac
          }

          get_quality_gate_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "⚠️ Failed" ;;
              *) echo "⚠️ Skipped" ;;
            esac
          }

          SNYK_CODE_STATUS=$(get_status "${SNYK_CODE_STATUS_INPUT}")
          SNYK_OSS_STATUS=$(get_status "${SNYK_OSS_STATUS_INPUT}")
          SONAR_SCAN_STATUS=$(get_status "${SONAR_SCAN_STATUS_INPUT}")
          QUALITY_GATE_STATUS=$(get_quality_gate_status "${QUALITY_GATE_STATUS_INPUT}")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🔍 CI Analysis Summary - ${PROJECT_TYPE}

          ## 📊 Test Coverage
          - **Coverage**: ${TEST_COVERAGE}%
          - **Report**: [View Coverage Report](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## 🔒 Security Scans (Snyk)
          - **Code (SAST)**: ${SNYK_CODE_STATUS}
          - **Open Source (SCA)**: ${SNYK_OSS_STATUS}
          - **SCA Issues Found**: ${SNYK_ISSUES}

          ## 🎯 Code Quality (SonarQube)
          - **Status**: ${SONAR_SCAN_STATUS}
          - **Quality Gate**: ${QUALITY_GATE_STATUS}

          ## 📦 Build Status
          - **Build**: ✅ Successful
          - **Lint**: ✅ Passed
          - **Tests**: ✅ Passed
          EOF

  comment-pr:
    name: Comment PR with Results
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment PR with Analysis Results
        uses: actions/github-script@v8  # v8.0.0
        # SHA: ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PROJECT_TYPE: ${{ inputs.project_type }}
          TEST_COVERAGE: ${{ inputs.test_coverage || '0' }}
          SNYK_CODE_STATUS: ${{ inputs.snyk_code_status }}
          SNYK_OSS_STATUS: ${{ inputs.snyk_oss_status }}
          SNYK_ISSUES: ${{ inputs.snyk_issues || 0 }}
          SONAR_SCAN_STATUS: ${{ inputs.sonar_scan_status }}
          QUALITY_GATE_STATUS: ${{ inputs.quality_gate_status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectType = process.env.PROJECT_TYPE;
            const coverage = process.env.TEST_COVERAGE;
            const snykCodeStatus = process.env.SNYK_CODE_STATUS;
            const snykOssStatus = process.env.SNYK_OSS_STATUS;
            const snykIssues = process.env.SNYK_ISSUES;
            const sonarStatus = process.env.SONAR_SCAN_STATUS;
            const qualityGateStatus = process.env.QUALITY_GATE_STATUS;

            const comment = `## 🔍 Code Analysis Results - ${projectType}

            ### 📊 Test Coverage
            | Metric | Value |
            |--------|-------|
            | **Line Coverage** | ${coverage}% |
            | **Coverage Report** | [View Artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |

            ### 🔒 Security Scans (Snyk)
            | Scan Type | Status | Details |
            |-----------|--------|---------|
            | **Code (SAST)** | ${snykCodeStatus === 'success' ? '✅ Completed' : (snykCodeStatus === 'failure' ? '⚠️ Failed' : '⚠️ Skipped')} | [View in Code Scanning](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning) |
            | **Open Source (SCA)** | ${snykOssStatus === 'success' ? '✅ Completed' : (snykOssStatus === 'failure' ? '⚠️ Failed' : '⚠️ Skipped')} | ${snykIssues !== '0' ? `⚠️ ${snykIssues} vulnerabilities found` : '✅ No issues'} |
            ${snykOssStatus === 'success' && snykIssues !== '0' ? '| **Action Required** | ⚠️ Review vulnerabilities in [Snyk Dashboard](https://app.snyk.io/) |' : ''}

            ### 🎯 Code Quality (SonarQube)
            | Metric | Value |
            |--------|-------|
            | **Scan Status** | ${sonarStatus === 'success' ? '✅ Completed' : (sonarStatus === 'failure' ? '⚠️ Failed' : '⚠️ Skipped')} |
            | **Quality Gate** | ${qualityGateStatus === 'success' ? '✅ Passed' : (qualityGateStatus === 'failure' ? '⚠️ Failed' : '⚠️ Skipped')} |
            ${sonarStatus === 'success' ? '| **View Report** | [SonarQube Cloud Dashboard](https://sonarcloud.io/dashboard?id=kkrzysztofik_Anyka_ak3918_hacking_journey) |' : ''}

            ### ✅ Build Status
            - **Lint**: ✅ Passed
            - **Tests**: ✅ Passed
            - **Build**: ✅ Successful

            ---
            *This comment is automatically updated on each push to the PR*`;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Code Analysis Results - ' + projectType)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
