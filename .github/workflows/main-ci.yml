name: CI - Unified Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "cross-compile/onvif-rust/**"
      - "cross-compile/streaming-lib/**"
      - "cross-compile/anyka-init/**"
      - "cross-compile/www/**"
      - "validation/**"
      - "scripts/**"
      - "SD_card_contents/**"
      - "cross-compile/Cargo.lock"
      - "cross-compile/Cargo.toml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "cross-compile/onvif-rust/**"
      - "cross-compile/streaming-lib/**"
      - "cross-compile/anyka-init/**"
      - "cross-compile/www/**"
      - "validation/**"
      - "scripts/**"
      - "SD_card_contents/**"
      - "cross-compile/Cargo.lock"
      - "cross-compile/Cargo.toml"
      - ".github/workflows/**"

jobs:
  # =============================================================================
  # RUST BACKEND - Lint (parallel with coverage)
  # =============================================================================
  rust-lint:
    name: Rust - Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: kkrzysztofik/anyka-cross-compile:rust-1.97.1-ci
      options: --security-opt seccomp=unconfined
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: 5G
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup ARMv5TEJ Patches
        working-directory: cross-compile/patches
        run: |
          bash setup.sh

      - name: Setup Cargo Config
        working-directory: cross-compile/onvif-rust
        run: |
          ./scripts/setup-cargo-config.sh

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-rust-reg-${{ hashFiles('cross-compile/Cargo.lock') }}
          restore-keys: |
            cargo-linux-rust-reg-

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/sccache
          key: sccache-linux-${{ hashFiles('cross-compile/Cargo.lock') }}
          restore-keys: |
            sccache-linux-

      - name: Check Formatting
        working-directory: cross-compile
        run: |
          cargo fmt --check

      - name: Run Clippy
        working-directory: cross-compile
        run: |
          cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Test Build Scripts (Python)
        working-directory: cross-compile/onvif-rust/scripts
        run: |
          python3 -m unittest discover -p 'test_*.py' -v

      - name: Show sccache stats
        if: always()
        run: sccache -s || true

  # =============================================================================
  # RUST BACKEND - Test & Coverage (parallel with lint)
  # =============================================================================
  rust-coverage:
    name: Rust - Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: kkrzysztofik/anyka-cross-compile:rust-1.97.1-ci
      options: --security-opt seccomp=unconfined
    env:
      # llvm-cov becomes RUSTC_WRAPPER and chains this via PRE_EXISTING (sccache → rustc).
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: 5G
    outputs:
      coverage: ${{ steps.coverage-summary.outputs.coverage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup ARMv5TEJ Patches
        working-directory: cross-compile/patches
        run: |
          bash setup.sh

      - name: Setup Cargo Config
        working-directory: cross-compile/onvif-rust
        run: |
          ./scripts/setup-cargo-config.sh

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-rust-reg-${{ hashFiles('cross-compile/Cargo.lock') }}
          restore-keys: |
            cargo-linux-rust-reg-

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/sccache
          key: sccache-linux-${{ hashFiles('cross-compile/Cargo.lock') }}
          restore-keys: |
            sccache-linux-

      - name: Run Tests with Coverage
        working-directory: cross-compile
        run: |
          IGNORE_REGEX='(/xiu/|/patches/|/anyka_reference/|/onvif/|webrtc-util|webrtc-ice|webrtc-sctp|/rtp-|tokio-metrics|openssl-src)'
          cargo llvm-cov \
            --workspace \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --ignore-filename-regex "$IGNORE_REGEX" \
            --no-report
          mkdir -p coverage
          cargo llvm-cov report \
            --target x86_64-unknown-linux-gnu \
            --ignore-filename-regex "$IGNORE_REGEX" \
            --cobertura --output-path coverage/cobertura.xml
          cargo llvm-cov report \
            --target x86_64-unknown-linux-gnu \
            --ignore-filename-regex "$IGNORE_REGEX" \
            --lcov --output-path coverage/lcov.info
          cargo llvm-cov report \
            --target x86_64-unknown-linux-gnu \
            --ignore-filename-regex "$IGNORE_REGEX" \
            --html --output-dir coverage/html
          echo ""
          echo "=== Coverage Files Generated ==="
          echo "Files in coverage directory:"
          ls -lah coverage/ || echo "Coverage directory not found"
          echo ""
          if [ -f "coverage/cobertura.xml" ]; then
            echo "✅ cobertura.xml found"
            echo "   Size: $(wc -c < coverage/cobertura.xml) bytes"
            echo "   Contains coverage data: $(grep -q 'coverage' coverage/cobertura.xml && echo 'Yes' || echo 'No')"
          else
            echo "❌ cobertura.xml NOT FOUND"
            echo "   Searching for XML files:"
            find coverage -name "*.xml" 2>/dev/null || echo "   No XML files found"
          fi
          if [ -f "coverage/lcov.info" ]; then
            echo "✅ lcov.info found"
            echo "   Size: $(wc -c < coverage/lcov.info) bytes"
          else
            echo "⚠️ lcov.info NOT FOUND"
          fi

          # Rewrite Cobertura to repo-root-relative paths for Sonar
          # (sonar.sources=cross-compile; llvm-cov emits workspace-relative paths).
          if [ -f "coverage/cobertura.xml" ]; then
            python3 "${GITHUB_WORKSPACE}/scripts/ci/rewrite_cobertura_paths.py" coverage/cobertura.xml
          fi

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rust-coverage
          path: |
            cross-compile/coverage/cobertura.xml
            cross-compile/coverage/lcov.info
            cross-compile/coverage/html
          retention-days: 7

      - name: Generate Coverage Summary
        id: coverage-summary
        run: |
          COVERAGE="0.00"

          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('cross-compile/coverage/cobertura.xml'); root = tree.getroot(); rate = float(root.get('line-rate', 0)) * 100; print(f'{rate:.2f}')" 2>/dev/null || echo "0.00")
            echo "✅ Rust Workspace Coverage: ${COVERAGE}%"
          else
            echo "⚠️ Rust workspace coverage file not found"
          fi

          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Show sccache stats
        if: always()
        run: sccache -s || true

  # =============================================================================
  # VALIDATION (RTSP) - Lint, Test & Coverage
  # =============================================================================
  validation-rust-quality:
    name: Validation (Rust) - Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage-summary.outputs.coverage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        # SHA: cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            validation/target
          key: cargo-${{ runner.os }}-validation-${{ hashFiles('validation/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-validation-

      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin &> /dev/null; then
            cargo install cargo-tarpaulin --locked
          else
            echo "cargo-tarpaulin already installed"
          fi

      - name: Check Formatting
        working-directory: validation/rust
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: validation/rust
        run: cargo clippy --target x86_64-unknown-linux-gnu --release -- -D warnings

      - name: Run Tests with Coverage
        working-directory: validation/rust
        run: |
          # Use dev profile (no --release) so coverage reports all source lines;
          # release optimizations (inlining, DCE) reduce instrumented line count.
          cargo tarpaulin \
            --target x86_64-unknown-linux-gnu \
            --all-targets \
            --out Html \
            --out Lcov \
            --out Xml \
            --output-dir coverage
          echo ""
          echo "=== Validation Rust Coverage Files ==="
          ls -lah coverage/ 2>/dev/null || echo "Coverage directory not found"

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # SHA: b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: validation-rust-coverage
          path: |
            validation/rust/coverage/cobertura.xml
            validation/rust/coverage/lcov.info
            validation/rust/coverage/tarpaulin-report.html
          retention-days: 7

      - name: Generate Coverage Summary
        id: coverage-summary
        run: |
          COVERAGE="0.00"
          if [ -f "validation/rust/coverage/cobertura.xml" ]; then
            COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('validation/rust/coverage/cobertura.xml'); root = tree.getroot(); rate = float(root.get('line-rate', 0)) * 100; print(f'{rate:.2f}')" 2>/dev/null || echo "0.00")
            echo "✅ Validation (Rust) Coverage: ${COVERAGE}%"
          else
            echo "⚠️ Validation Rust coverage file not found"
          fi
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

  # =============================================================================
  # WEBUI FRONTEND - Lint, Test & Coverage
  # =============================================================================
  webui-quality-and-coverage:
    name: WebUI - Lint, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cross-compile/www
    outputs:
      coverage: ${{ steps.test-coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
        # SHA: de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.0.0
        # SHA: 53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cross-compile/www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with Coverage
        id: test-coverage
        run: |
          npm run test:coverage
          echo ""
          echo "=== Coverage Files Generated ==="
          echo "Files in coverage directory:"
          ls -lah coverage/ 2>/dev/null || echo "Coverage directory not found"
          echo ""
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); console.log(data.total.lines.pct.toFixed(2))")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "✅ WebUI Coverage: ${COVERAGE}%"
            echo "   Coverage summary file size: $(wc -c < coverage/coverage-summary.json) bytes"
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "⚠️ WebUI coverage-summary.json file not found"
          fi
          if [ -f "coverage/lcov.info" ]; then
            echo "✅ lcov.info found"
            echo "   Size: $(wc -c < coverage/lcov.info) bytes"
            echo "   Source files in LCOV: $(grep -c '^SF:' coverage/lcov.info || echo '0')"
            echo "   Coverage data lines: $(grep -c '^DA:' coverage/lcov.info || echo '0')"
          else
            echo "❌ lcov.info NOT FOUND - This is required for SonarQube!"
            echo "   Searching for LCOV files:"
            find coverage -name "*.info" -o -name "lcov*" 2>/dev/null || echo "   No LCOV files found"
          fi

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # SHA: b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: webui-coverage
          path: |
            cross-compile/www/coverage/lcov.info
            cross-compile/www/coverage/coverage-summary.json
            cross-compile/www/coverage/index.html
          retention-days: 7

  # =============================================================================
  # SECURITY SCANS - Rust dependency advisories (RustSec)
  # =============================================================================
  # cargo-audit parses Cargo.lock only; no build, no vendored toolchain.
  # Vulnerabilities fail the job. Informational advisories (unmaintained,
  # unsound, yanked) are reported as warnings and do not fail it.
  # SAST is covered by CodeQL default setup and SonarCloud, not here.
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      audit_status: ${{ steps.audit-status.outputs.audit_status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0

      - name: Audit cross-compile workspace
        id: audit-workspace
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: cross-compile
          # Temporary waivers: a single comma-separated list of advisory IDs,
          # e.g. "RUSTSEC-2020-0071,RUSTSEC-2021-0124". Record the reason and
          # removal date in a comment here. Empty is the steady state.
          ignore: ""

      - name: Audit validation tool
        id: audit-validation
        if: always()
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: validation/rust
          # Temporary waivers: a single comma-separated list of advisory IDs,
          # e.g. "RUSTSEC-2020-0071,RUSTSEC-2021-0124". Record the reason and
          # removal date in a comment here. Empty is the steady state.
          ignore: ""

      - name: Record audit status
        id: audit-status
        if: always()
        run: |
          if [ "${{ steps.audit-workspace.outcome }}" = "success" ] && \
             [ "${{ steps.audit-validation.outcome }}" = "success" ]; then
            echo "audit_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "audit_status=failure" >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # SONARQUBE - Unified Quality Analysis
  # =============================================================================
  sonarqube:
    name: SonarQube Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-coverage, webui-quality-and-coverage, validation-rust-quality]
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    outputs:
      sonar-scan-status: ${{ steps.sonar-scan.outcome }}
      quality-gate-status: ${{ steps.sonar-quality-gate.outcome || steps.skip-quality-gate.outputs.status || 'skipped' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
        with:
          fetch-depth: 0

      - name: Download All Coverage Artifacts
        # TODO: Evaluate upgrade to actions/download-artifact v8 for compatibility with upload-artifact v6
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "*-coverage"
          path: coverage-artifacts

      - name: Merge Coverage Reports
        run: |
          # Create coverage directories
          mkdir -p cross-compile/coverage
          mkdir -p cross-compile/www/coverage
          mkdir -p validation/rust/coverage

          # Copy Rust workspace coverage if available
          if [ -f "coverage-artifacts/rust-coverage/cobertura.xml" ]; then
            cp coverage-artifacts/rust-coverage/cobertura.xml cross-compile/coverage/
            cp coverage-artifacts/rust-coverage/lcov.info cross-compile/coverage/ 2>/dev/null || true
            echo "✅ Rust workspace coverage copied"
          fi

          # Copy Validation (Rust) coverage if available
          if [ -f "coverage-artifacts/validation-rust-coverage/cobertura.xml" ]; then
            cp coverage-artifacts/validation-rust-coverage/cobertura.xml validation/rust/coverage/
            cp coverage-artifacts/validation-rust-coverage/lcov.info validation/rust/coverage/ 2>/dev/null || true
            echo "✅ Validation Rust coverage copied"
            # Fix cobertura paths: coverage tools may emit paths relative to crate (e.g. src/lib.rs)
            # SonarQube expects paths relative to project root (validation/rust/src/lib.rs)
            if [ -f "validation/rust/coverage/cobertura.xml" ]; then
              sed -i 's|filename="src/|filename="validation/rust/src/|g' validation/rust/coverage/cobertura.xml
              echo "✅ Validation Rust cobertura paths transformed to project root relative"
            fi
          fi

          # Copy WebUI coverage if available
          if [ -f "coverage-artifacts/webui-coverage/lcov.info" ]; then
            cp coverage-artifacts/webui-coverage/lcov.info cross-compile/www/coverage/
            cp coverage-artifacts/webui-coverage/coverage-summary.json cross-compile/www/coverage/ 2>/dev/null || true
            echo "✅ WebUI coverage copied"

            # Fix LCOV file paths to be relative to project root for SonarQube
            # Vitest generates paths like "SF:src/App.tsx" (relative to cross-compile/www)
            # but SonarQube expects "SF:cross-compile/www/src/App.tsx" (relative to project root)
            echo "🔧 Transforming LCOV paths to be relative to project root..."
            if [ -f "cross-compile/www/coverage/lcov.info" ]; then
              # Create backup
              cp cross-compile/www/coverage/lcov.info cross-compile/www/coverage/lcov.info.bak
              # Transform all SF: paths to include the cross-compile/www/ prefix
              # This handles paths like "SF:src/..." -> "SF:cross-compile/www/src/..."
              sed -i 's|^SF:\(.*\)|SF:cross-compile/www/\1|g' cross-compile/www/coverage/lcov.info
              echo "✅ LCOV paths transformed to project root relative paths"
              echo "   Sample transformed paths (first 5):"
              grep '^SF:' cross-compile/www/coverage/lcov.info | head -5 || echo "   No SF entries found"
              echo "   Total source files in LCOV: $(grep -c '^SF:' cross-compile/www/coverage/lcov.info || echo '0')"
            fi
          fi

          # Verify coverage files exist
          echo "=== Coverage Verification ==="
          echo "Rust Workspace Cobertura: $(ls -lh cross-compile/coverage/cobertura.xml 2>/dev/null || echo 'Not found')"
          echo "Validation Rust Cobertura: $(ls -lh validation/rust/coverage/cobertura.xml 2>/dev/null || echo 'Not found')"
          echo "WebUI LCOV: $(ls -lh cross-compile/www/coverage/lcov.info 2>/dev/null || echo 'Not found')"

      - name: Verify Coverage Reports
        run: |
          echo "=== DEBUG: Coverage Investigation ==="
          echo "Current working directory: $(pwd)"
          echo ""

          # Debug: List all downloaded artifacts
          echo "=== Downloaded Artifacts Structure ==="
          find coverage-artifacts -type f 2>/dev/null | head -20 || echo "No artifacts found"
          echo ""

          # Debug: Check artifact contents
          echo "=== Artifact Directory Contents ==="
          ls -la coverage-artifacts/ 2>/dev/null || echo "Artifacts directory not found"
          if [ -d "coverage-artifacts/rust-coverage" ]; then
            echo "Rust coverage artifact contents:"
            ls -lah coverage-artifacts/rust-coverage/ || true
          fi
          if [ -d "coverage-artifacts/webui-coverage" ]; then
            echo "WebUI coverage artifact contents:"
            ls -lah coverage-artifacts/webui-coverage/ || true
          fi
          echo ""

          echo "=== Coverage Files After Merge ==="

          # Check Rust workspace coverage with detailed info
          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            echo "✅ Found Rust workspace coverage: cross-compile/coverage/cobertura.xml"
            ls -lh cross-compile/coverage/
            echo "File size: $(wc -c < cross-compile/coverage/cobertura.xml) bytes"
            echo "First 10 lines of cobertura.xml:"
            head -10 cross-compile/coverage/cobertura.xml || true
            echo "Checking for coverage data in XML:"
            grep -c "class name" cross-compile/coverage/cobertura.xml || echo "No class elements found"
            grep -c "line number" cross-compile/coverage/cobertura.xml || echo "No line number elements found"
          else
            echo "❌ Rust workspace coverage NOT FOUND at: cross-compile/coverage/cobertura.xml"
            echo "Checking if directory exists:"
            ls -la cross-compile/coverage/ 2>/dev/null || echo "Directory does not exist"
          fi
          echo ""

          # Check WebUI coverage with detailed info
          if [ -f "cross-compile/www/coverage/lcov.info" ]; then
            echo "✅ Found WebUI coverage: cross-compile/www/coverage/lcov.info"
            ls -lh cross-compile/www/coverage/
            echo "File size: $(wc -c < cross-compile/www/coverage/lcov.info) bytes"
            echo "First 20 lines of lcov.info:"
            head -20 cross-compile/www/coverage/lcov.info || true
            echo "Checking for coverage data in LCOV:"
            grep -c "^SF:" cross-compile/www/coverage/lcov.info || echo "No source file entries found"
            grep -c "^DA:" cross-compile/www/coverage/lcov.info || echo "No line coverage data found"
          else
            echo "❌ WebUI coverage NOT FOUND at: cross-compile/www/coverage/lcov.info"
            echo "Checking if directory exists:"
            ls -la cross-compile/www/coverage/ 2>/dev/null || echo "Directory does not exist"
          fi
          echo ""

          # Verify paths match sonar-project.properties
          echo "=== SonarQube Configuration Check ==="
          echo "Expected paths from sonar-project.properties:"
          grep "sonar.coverage.jacoco.xmlReportPaths" sonar-project.properties || echo "Rust coverage path not found in config"
          grep "sonar.javascript.lcov.reportPaths" sonar-project.properties || echo "WebUI coverage path not found in config"
          echo ""

          # Check if files are readable
          echo "=== File Readability Check ==="
          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            if [ -r "cross-compile/coverage/cobertura.xml" ]; then
              echo "✅ Rust workspace coverage file is readable"
            else
              echo "❌ Rust workspace coverage file is NOT readable"
            fi
          fi
          if [ -f "cross-compile/www/coverage/lcov.info" ]; then
            if [ -r "cross-compile/www/coverage/lcov.info" ]; then
              echo "✅ WebUI coverage file is readable"
            else
              echo "❌ WebUI coverage file is NOT readable"
            fi
          fi
          echo ""

          echo "=== Absolute Path Check ==="
          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            echo "Rust workspace coverage absolute path: $(realpath cross-compile/coverage/cobertura.xml)"
          fi
          if [ -f "cross-compile/www/coverage/lcov.info" ]; then
            echo "WebUI coverage absolute path: $(realpath cross-compile/www/coverage/lcov.info)"
          fi

      - name: Pre-Scan Coverage Verification
        run: |
          echo "=== Pre-Scan Coverage File Verification ==="
          echo "Verifying files exist at expected paths before SonarQube scan..."
          echo ""

          # Check Rust coverage
          RUST_COV_PATH="cross-compile/coverage/cobertura.xml"
          if [ -f "$RUST_COV_PATH" ]; then
            echo "✅ Rust workspace coverage file exists: $RUST_COV_PATH"
            echo "   Size: $(stat -f%z "$RUST_COV_PATH" 2>/dev/null || stat -c%s "$RUST_COV_PATH" 2>/dev/null) bytes"
            echo "   Contains coverage data: $(grep -q 'line-rate' "$RUST_COV_PATH" && echo 'Yes' || echo 'No')"
            echo "   Sample of file paths in XML (first 5):"
            grep -o 'filename="[^"]*"' "$RUST_COV_PATH" | head -5 || echo "   No filename attributes found"
          else
            echo "❌ Rust workspace coverage file MISSING: $RUST_COV_PATH"
            echo "   Searching for any XML files in coverage directory:"
            find cross-compile/coverage -name "*.xml" 2>/dev/null || echo "   No XML files found"
          fi
          echo ""

          # Check WebUI coverage
          WEBUI_COV_PATH="cross-compile/www/coverage/lcov.info"
          if [ -f "$WEBUI_COV_PATH" ]; then
            echo "✅ WebUI coverage file exists: $WEBUI_COV_PATH"
            echo "   Size: $(stat -f%z "$WEBUI_COV_PATH" 2>/dev/null || stat -c%s "$WEBUI_COV_PATH" 2>/dev/null) bytes"
            echo "   Contains coverage data: $(grep -q '^SF:' "$WEBUI_COV_PATH" && echo 'Yes' || echo 'No')"
            echo "   Sample of file paths in LCOV (first 5):"
            grep '^SF:' "$WEBUI_COV_PATH" | head -5 || echo "   No SF entries found"
          else
            echo "❌ WebUI coverage file MISSING: $WEBUI_COV_PATH"
            echo "   Searching for any LCOV files in coverage directory:"
            find cross-compile/www/coverage -name "*.info" -o -name "lcov*" 2>/dev/null || echo "   No LCOV files found"
          fi
          echo ""

          # Show sonar-project.properties coverage paths
          echo "=== SonarQube Coverage Configuration ==="
          echo "Rust coverage path from config:"
          grep "sonar.rust.cobertura.reportPaths\|sonar.coverage.jacoco.xmlReportPaths" sonar-project.properties || echo "  (not found)"
          echo "WebUI coverage path from config:"
          grep "sonar.javascript.lcov.reportPaths" sonar-project.properties || echo "  (not found)"
          echo ""

          # Verify paths are relative to project root
          echo "=== Path Resolution Check ==="
          echo "Project root: $(pwd)"
          echo "Rust coverage relative path check:"
          if [ -f "$RUST_COV_PATH" ]; then
            echo "  ✅ File exists at relative path"
            echo "  Absolute: $(realpath "$RUST_COV_PATH" 2>/dev/null || echo 'Cannot resolve')"
          fi
          echo "WebUI coverage relative path check:"
          if [ -f "$WEBUI_COV_PATH" ]; then
            echo "  ✅ File exists at relative path"
            echo "  Absolute: $(realpath "$WEBUI_COV_PATH" 2>/dev/null || echo 'Cannot resolve')"
          fi

      - name: SonarQube Scan
        id: sonar-scan
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9  # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check if scannerwork exists
        id: check-scannerwork
        if: always()
        run: |
          if [ -f ".scannerwork/report-task.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found report-task.txt"
            cat .scannerwork/report-task.txt
            echo ""
            echo "=== Scanner Log Analysis ==="
            if [ -f ".scannerwork/logs/sonar-scanner.log" ]; then
              echo "Checking scanner logs for coverage-related messages:"
              grep -i "coverage\|jacoco\|lcov" .scannerwork/logs/sonar-scanner.log | head -20 || echo "No coverage-related log entries found"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ report-task.txt not found - scan may have failed"
            echo "Checking for scannerwork directory:"
            ls -la .scannerwork/ 2>/dev/null || echo "Scannerwork directory not found"
          fi

      - name: Analyze Coverage for Changed Files
        if: always()
        run: |
          echo "=== Coverage Analysis for Changed Files ==="
          echo "This helps identify which changed files have coverage data"
          echo ""

          # Get list of changed files in the PR (TypeScript/JavaScript only)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Changed TypeScript/JavaScript files in PR:"
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx)$' | grep -v test | grep -v spec | head -20 || echo "No changed TS/JS files found"
            echo ""

            # Check which changed files have coverage in LCOV
            if [ -f "cross-compile/www/coverage/lcov.info" ]; then
              echo "Changed files WITH coverage in LCOV:"
              git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx)$' | grep -v test | grep -v spec | while read file; do
                if grep -q "^SF:cross-compile/www/$file" cross-compile/www/coverage/lcov.info; then
                  echo "  ✅ $file"
                else
                  echo "  ❌ $file (no coverage data)"
                fi
              done
            fi
          else
            echo "Not a pull request - skipping changed files analysis"
          fi

      - name: Post-Scan Coverage Verification
        if: always()
        run: |
          echo "=== Post-Scan Coverage Analysis ==="
          echo "Checking if coverage files are still present after scan:"
          echo ""
          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            echo "✅ Rust workspace coverage still exists after scan"
            echo "   File size: $(wc -c < cross-compile/coverage/cobertura.xml) bytes"
          else
            echo "❌ Rust workspace coverage missing after scan"
          fi
          if [ -f "cross-compile/www/coverage/lcov.info" ]; then
            echo "✅ WebUI coverage still exists after scan"
            echo "   File size: $(wc -c < cross-compile/www/coverage/lcov.info) bytes"
          else
            echo "❌ WebUI coverage missing after scan"
          fi
          echo ""
          echo "=== Coverage File Content Sample ==="
          if [ -f "cross-compile/coverage/cobertura.xml" ]; then
            echo "Rust workspace coverage XML header:"
            head -5 cross-compile/coverage/cobertura.xml || true
            echo ""
            echo "Rust workspace coverage summary (line-rate):"
            grep -o 'line-rate="[^"]*"' cross-compile/coverage/cobertura.xml | head -1 || echo "No line-rate found"
          fi
          if [ -f "cross-compile/www/coverage/lcov.info" ]; then
            echo "WebUI coverage LCOV header:"
            head -5 cross-compile/www/coverage/lcov.info || true
            echo ""
            echo "WebUI coverage file count:"
            grep -c "^SF:" cross-compile/www/coverage/lcov.info || echo "0"
          fi

      - name: SonarQube Quality Gate Check
        id: sonar-quality-gate
        if: steps.check-scannerwork.outputs.exists == 'true'
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip Quality Gate (scan failed)
        if: steps.check-scannerwork.outputs.exists != 'true'
        id: skip-quality-gate
        run: |
          echo "⚠️ Skipping quality gate check - SonarQube scan did not complete successfully"
          echo "status=skipped" >> $GITHUB_OUTPUT

      - name: Generate and Upload SARIF Report
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "### 🎯 SonarQube Issues Report"
          # Using environment variable to prevent code injection
          ISSUES=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=kkrzysztofik_Anyka_ak3918_hacking_journey&resolved=false&ps=100")
          COUNT=$(echo $ISSUES | jq '.total')

          cat > sonar-report.sarif <<EOF
          {
            "\$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "SonarCloud",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

          if [ "$COUNT" -eq "0" ]; then
            echo "✅ No open issues found in SonarQube."
          else
            echo "⚠️ Found $COUNT open issues."
            echo $ISSUES | jq -r '.issues[] | "- [\(.severity)] \(.message) (\(.component):\(.line))"'

            echo $ISSUES | jq '
              def map_severity(s):
                if s == "BLOCKER" or s == "CRITICAL" then "error"
                elif s == "MAJOR" then "warning"
                else "note" end;

              .issues | map({
                "ruleId": .rule,
                "level": map_severity(.severity),
                "message": { "text": .message },
                "locations": [{
                  "physicalLocation": {
                    "artifactLocation": { "uri": .component | sub("^kkrzysztofik_Anyka_ak3918_hacking_journey:"; "") },
                    "region": { "startLine": (.line // 1) }
                  }
                }]
              })
            ' > sarif-results.json

            jq --slurpfile results sarif-results.json '.runs[0].results = $results[0]' sonar-report.sarif > sonar-report-final.sarif
            mv sonar-report-final.sarif sonar-report.sarif
          fi

      - name: Upload SonarCloud Scan Results to GitHub
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.0.0
        # SHA: 0d579ffd059c29b07949a3cce3983f0780820c98
        continue-on-error: true
        with:
          sarif_file: sonar-report.sarif

  # =============================================================================
  # REPORTING - Unified CI Report
  # =============================================================================
  reporting:
    name: Generate Unified CI Report
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      [
        rust-lint,
        rust-coverage,
        webui-quality-and-coverage,
        validation-rust-quality,
        security-scans,
        sonarqube,
      ]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Generate Run Summary
        env:
          RUST_COVERAGE: ${{ needs.rust-coverage.outputs.coverage || 'N/A' }}
          VALIDATION_RUST_COVERAGE: ${{ needs.validation-rust-quality.outputs.coverage || 'N/A' }}
          WEBUI_COVERAGE: ${{ needs.webui-quality-and-coverage.outputs.coverage || 'N/A' }}
          AUDIT_STATUS: ${{ needs.security-scans.outputs.audit_status }}
          SONAR_SCAN_STATUS: ${{ needs.sonarqube.outputs.sonar-scan-status }}
          QUALITY_GATE_STATUS: ${{ needs.sonarqube.outputs.quality-gate-status }}
          # Real job results. This job runs under !cancelled(), so it reports
          # after failures too -- never hardcode success text here.
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_TEST_RESULT: ${{ needs.rust-coverage.result }}
          WEBUI_RESULT: ${{ needs.webui-quality-and-coverage.result }}
          VALIDATION_RESULT: ${{ needs.validation-rust-quality.result }}
        run: |
          get_status() {
            case "$1" in
              success) echo "✅ Completed" ;;
              failure) echo "⚠️ Failed" ;;
              *) echo "⚠️ Skipped" ;;
            esac
          }

          get_quality_gate_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "⚠️ Failed" ;;
              *) echo "⚠️ Skipped" ;;
            esac
          }

          AUDIT_STATUS=$(get_status "${AUDIT_STATUS}")
          SONAR_SCAN_STATUS=$(get_status "${SONAR_SCAN_STATUS}")
          QUALITY_GATE_STATUS=$(get_quality_gate_status "${QUALITY_GATE_STATUS}")
          RUST_LINT_RESULT=$(get_quality_gate_status "${RUST_LINT_RESULT}")
          RUST_TEST_RESULT=$(get_quality_gate_status "${RUST_TEST_RESULT}")
          WEBUI_RESULT=$(get_quality_gate_status "${WEBUI_RESULT}")
          VALIDATION_RESULT=$(get_quality_gate_status "${VALIDATION_RESULT}")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🔍 Unified CI Analysis Summary

          ## 📊 Test Coverage
          | Project | Coverage |
          |---------|----------|
          | **Rust ONVIF API** | ${RUST_COVERAGE}% |
          | **Validation (Rust)** | ${VALIDATION_RUST_COVERAGE}% |
          | **WebUI** | ${WEBUI_COVERAGE}% |

          ## 🔒 Dependency Advisories (cargo audit)
          - **Rust crates (RustSec)**: ${AUDIT_STATUS}
          - **SAST**: see CodeQL and SonarCloud below

          ## 🎯 Code Quality (SonarQube)
          - **Status**: ${SONAR_SCAN_STATUS}
          - **Quality Gate**: ${QUALITY_GATE_STATUS}

          ## 📦 Job Results
          - **Rust — Lint**: ${RUST_LINT_RESULT}
          - **Rust — Test & Coverage**: ${RUST_TEST_RESULT}
          - **Validation (Rust)**: ${VALIDATION_RESULT}
          - **WebUI**: ${WEBUI_RESULT}
          EOF

      - name: Comment PR with Analysis Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        # SHA: ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rustCoverage = '${{ needs.rust-coverage.outputs.coverage || 'N/A' }}';
            const validationRustCoverage = '${{ needs.validation-rust-quality.outputs.coverage || 'N/A' }}';
            const webuiCoverage = '${{ needs.webui-quality-and-coverage.outputs.coverage || 'N/A' }}';
            const auditStatus = '${{ needs.security-scans.outputs.audit_status }}';
            const sonarStatus = '${{ needs.sonarqube.outputs.sonar-scan-status }}';
            const qualityGateStatus = '${{ needs.sonarqube.outputs.quality-gate-status }}';
            // Real job results. This job runs under !cancelled(), so it reports
            // after failures too -- never hardcode success text here.
            const jobResults = [
              ['Rust — Lint', '${{ needs.rust-lint.result }}'],
              ['Rust — Test & Coverage', '${{ needs.rust-coverage.result }}'],
              ['Validation (Rust)', '${{ needs.validation-rust-quality.result }}'],
              ['WebUI', '${{ needs.webui-quality-and-coverage.result }}'],
            ];

            const formatStatus = (status) => {
              if (status === 'success') return '✅ Completed';
              if (status === 'failure') return '⚠️ Failed';
              return '⚠️ Skipped';
            };

            const comment = `## 🔍 Unified Code Analysis Results

            ### 📊 Test Coverage
            | Project | Coverage |
            |---------|----------|
            | **Rust ONVIF API** | ${rustCoverage}% |
            | **Validation (Rust)** | ${validationRustCoverage}% |
            | **WebUI** | ${webuiCoverage}% |

            ### 🔒 Security
            | Scan Type | Status | Details |
            |-----------|--------|---------|
            | **Rust advisories (cargo audit)** | ${formatStatus(auditStatus)} | RustSec advisory database |
            | **SAST (CodeQL)** | ℹ️ Reported separately | [View in Code Scanning](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning) |

            ### 🎯 Code Quality (SonarQube)
            | Metric | Value |
            |--------|-------|
            | **Scan Status** | ${formatStatus(sonarStatus)} |
            | **Quality Gate** | ${formatStatus(qualityGateStatus)} |
            ${sonarStatus === 'success' ? '| **View Report** | [SonarQube Cloud Dashboard](https://sonarcloud.io/dashboard?id=kkrzysztofik_Anyka_ak3918_hacking_journey) |' : ''}

            ### 📦 Job Results
            ${jobResults.map(([name, result]) => `- **${name}**: ${formatStatus(result)}`).join('\n')}

            ---
            *This comment is automatically updated on each push to the PR*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Unified Code Analysis Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
