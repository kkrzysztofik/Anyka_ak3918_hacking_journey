# Dependabot version updates. Security alerts are enabled separately in
# repo settings and need no configuration here.
#
# Grouping is deliberate: ungrouped, four ecosystems produce a PR per crate
# per week. Grouped minor+patch means roughly one PR per ecosystem.
version: 2
updates:
  # The cross-compile workspace is deliberately absent: its [patch.crates-io]
  # points at a gitignored directory, which Dependabot cannot resolve. It is
  # updated by .github/workflows/cargo-update.yml instead.

  # Host-side RTSP validation tool
  - package-ecosystem: cargo
    directory: /validation/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Camera WebUI
  - package-ecosystem: npm
    directory: /cross-compile/www
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned to SHAs with a trailing version comment; Dependabot
  # updates the pin and that inline comment together. Note it does NOT update
  # the standalone "# SHA:" sidecar comments some workflows carry — those go
  # stale after a bump and are best deleted rather than trusted.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
