name: "CodeQL Configuration"

# Exclude paths from analysis (used by Default Setup when under .github/codeql/)
# Reference: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-advanced-setup-for-code-scanning#specifying-directories-to-scan

paths-ignore:
  - "cross-compile/anyka_reference/**"
  - "cross-compile/xiu/**"
  - "toolchain/**"
  - "orig/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/coverage/**"
  # Exclude test files — hardcoded credentials in tests are test fixtures, not secrets.
  # Covers: integration test directories and standalone test source files.
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
