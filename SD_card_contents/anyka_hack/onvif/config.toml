# ONVIF Camera Configuration File
# Configuration for onvif-rust daemon on Anyka AK3918 IP Camera
#
# This file should be placed at /etc/onvif/config.toml on the device
# or in the same directory as the onvif-rust binary when running from SD card.
#
# Default config path: /etc/onvif/config.toml

# ============================================================================
# ONVIF Protocol Settings
# ============================================================================
[onvif]
# Device service endpoint path
device_service_path = "/onvif/device_service"

# Media service endpoint path
media_service_path = "/onvif/media_service"

# PTZ service endpoint path
ptz_service_path = "/onvif/ptz_service"

# Imaging service endpoint path
imaging_service_path = "/onvif/imaging_service"

# ONVIF profile level (S, G, T)
profile_level = "S"

# ============================================================================
# Network Configuration
# ============================================================================
[network]
# Network interface name
interface = "eth0"

# Static IP address (leave empty for DHCP)
ip_address = ""

# Network mask (used with static IP)
netmask = "255.255.255.0"

# Default gateway (used with static IP)
gateway = ""

# Primary DNS server
dns_primary = ""

# Secondary DNS server
dns_secondary = ""

# Enable DHCP (true/false)
dhcp_enabled = true

# Obtain NTP servers from DHCP (true/false)
ntp_from_dhcp = true

# Primary NTP server (leave empty if using DHCP)
ntp_primary = ""

# Secondary NTP server (leave empty if using DHCP)
ntp_secondary = ""

# Enable HTTP protocol (true/false)
http_enabled = true

# Enable RTSP protocol (true/false)
rtsp_enabled = true

# ============================================================================
# Device Information
# ============================================================================
[device]
# Device manufacturer
manufacturer = "Anyka"

# Device model
model = "AK3918 Camera"

# Firmware version
firmware_version = "1.0.0"

# Serial number (leave empty to auto-generate from MAC address)
serial_number = ""

# Hardware identifier
hardware_id = "ak3918"

# Device hostname
hostname = "ipcam"

# ISP sensor config file path (leave empty for auto-detection)
# Auto-detection searches: /mnt/anyka_hack/onvif/, /etc/jffs2/, /usr/local/
isp_config_path = "/data/sensor/isp_gc1084.conf"

# Device UUID (leave empty to auto-generate)
uuid = ""

# Configurable ONVIF scopes (comma-separated, leave empty for defaults)
scopes = ""

# ============================================================================
# HTTP Server Settings
# ============================================================================
[server]
# HTTP server port (1-65535)
port = 80

# IP address to bind to (0.0.0.0 for all interfaces)
bind_address = "0.0.0.0"

# Maximum concurrent connections (1-256)
max_connections = 16

# Request timeout in seconds (1-300)
request_timeout = 30

# Maximum request body size in bytes (1024-10485760)
max_body_size = 1048576

# Debounce delay for config saves in milliseconds (50-10000)
config_save_delay_ms = 500

# Enable authentication (true/false)
auth_enabled = true

# Authentication realm
realm = "ONVIF Camera"

# Per-IP request cap for /onvif/* (fixed 60s window). 0 = unlimited.
# Static assets are not counted. The WebUI fires a burst of SOAP calls on
# login and on each page, so raise this if the UI starts seeing 429s.
rate_limit_per_minute = 300

# Path to static file root. Must be ABSOLUTE: ServeDir resolves a relative
# path against the process CWD, and anyka-init starts onvif-rust with CWD=/,
# so "www" resolved to /www and every UI request 404'd.
static_root = "/mnt/anyka_hack/onvif/www"


# ============================================================================
# Logging Configuration
# ============================================================================
[logging]
# Log level: error, warn, info, debug, trace
# error is the shipped default: measured on .121 that warn + an active
# streaming client emits ~144 MB/day of slow_tcp_write / slow_rtp_pack lines.
# error logs ~260 KB/day. Raise only while debugging.
level = "error"

# Enable verbose HTTP request/response logging
# !! PERFORMANCE: Set to false to reduce CPU and I/O overhead during streaming
http_verbose = false

# Enable per-frame streaming debug logs (AAC/H.264 timestamp + packetization internals)
# !! PERFORMANCE: Keep false on embedded devices; this emits logs for almost every frame/packet.
stream_frame_debug = false

# Enable console logging
# !! PERFORMANCE: Keep console_enabled=false on embedded devices to avoid I/O blocking
console_enabled = false

# Log file path (leave empty to disable file logging)
# !! PERFORMANCE: For profiling idle CPU, use tmpfs (/tmp/onvif.log) or disable ("")
# !! to eliminate SD card writes. For production, use persistent path.
file_path = "/mnt/logs/onvif-debug.log"

# Static asset access logging
[logging.static_assets]
# Enable static asset access logging
# !! PERFORMANCE: Disable when not debugging WebUI to reduce log I/O
enabled = false

# Directory for static asset access logs
file_path = "logs"

# Base name for static asset access log files (rotated daily)
file_name = "access"

# ============================================================================
# Media Stream Settings
# ============================================================================
[media]
# RTSP server port (1-65535)
rtsp_port = 554

# HTTP-FLV server port (1-65535)
httpflv_port = 8080

# Enable live streaming via RTSP and HTTP-FLV (true/false)
# When enabled, the platform's encoded frames are bridged to StreamsHub and
# served at rtsp://<ip>:<rtsp_port>/main, /sub and http://<ip>:<httpflv_port>/live/main.flv, /sub.flv
streaming_enabled = true

# Snapshot HTTP port (0 to use main server port)
snapshot_port = 0

# Snapshot endpoint path
snapshot_path = "/snapshot"

# Maximum concurrent streams (1-8)
max_streams = 4

# Datagrams per UDP RTP pacing batch (0 or 1 = send a whole frame in one syscall)
#
# With pacing off, a ~100 KB I-frame leaves as a single ~75-datagram burst. A receiver whose
# socket buffer is smaller than that clump loses part of every I-frame, and a partial I-frame
# costs the whole GOP (~2 s of video). Set 32 to split the burst into ~45 KB chunks.
#
# Cost: each batch boundary sleeps, and on this SoC a sleep costs ~12 ms regardless of the
# requested duration, so 32 adds ~24 ms of latency to a 75-packet frame. Raise only if a client
# stutters on I-frames over UDP; RTSP-over-TCP does not need this at all.
udp_pace_batch = 0

# ============================================================================
# PTZ Control Settings
# ============================================================================
[ptz]
# Enable PTZ control (true/false)
enabled = false

# Default pan speed (0.0-1.0)
pan_speed = 0.5

# Default tilt speed (0.0-1.0)
tilt_speed = 0.5

# Default zoom speed (0.0-1.0)
zoom_speed = 0.5

# Maximum number of presets (1-64)
max_presets = 16

# Move to home position on startup (true/false)
home_on_start = true

# Serialized PTZ presets for persistence (leave empty for none)
presets_json = ""

# Home position pan (-1.0 to 1.0, leave empty for default 0.0)
home_pan = 0.0

# Home position tilt (-1.0 to 1.0, leave empty for default 0.0)
home_tilt = 0.0

# Home position zoom (0.0 to 1.0, leave empty for default 0.0)
home_zoom = 0.0

# Next preset number for auto token generation (1-1000)
next_preset_num = 1

# ============================================================================
# Imaging Settings
# ============================================================================
[imaging]
# Default brightness (0.0-100.0)
brightness = 50.0

# Default contrast (0.0-100.0)
contrast = 50.0

# Default saturation (0.0-100.0)
saturation = 50.0

# Default sharpness (0.0-100.0)
sharpness = 50.0

# IR cut filter: "ON" (day), "OFF" (night), "AUTO" (follow light sensor).
# Applied to the hardware at start-up; ON/OFF also disable the AUTO poll loop.
ir_cut_filter = "AUTO"

# IR LED enabled (true/false)
ir_led = false

[imaging.night]
# Board wiring. Verified on 192.168.2.198 (two-line ircut, high=night).
ldr_high_is_day = true
ircut_high_is_night = true
# Raw ain0 thresholds are board-specific and MUST be calibrated per board:
# .198 reads dark-box≈648 / room≈670, .121 reads 548..639. Uncomment and set
# these only after measuring YOUR board's ain0 in both states. While commented,
# an unavailable AE reading never triggers the fallback (it holds instead).
# day_threshold = 662
# night_threshold = 652
# Minimum ms between day/night transitions. Prevents dusk oscillation.
lock_time_ms = 900000
# AE luma (0-255). Measured 2026-08-04 on .198: room≈34, dark-box≈0..1.
# day >= 28, night <= 8; 9..27 indeterminate (hold).
ae_day_threshold = 28
ae_night_threshold = 8

# ============================================================================
# WS-Discovery Settings
# ============================================================================
[discovery]
# Device endpoint UUID for WS-Discovery (leave empty to auto-generate and persist)
endpoint_uuid = ""

# Local IP address for XAddrs ('auto' for automatic detection)
local_ip = "auto"

# Enable WS-Discovery service (true/false)
enabled = true

# Hello announcement interval in seconds (30-3600)
hello_interval = 300

# ============================================================================
# Stream Profile 1 (Main Stream - High Quality)
# ============================================================================
[stream_profile_1]
# Enable this profile (required for profile to be loaded)
enabled = true

# Profile name
name = "Profile1"

# Video width (160-3840)
width = 1280

# Video height (120-2160)
height = 720

# Frame rate (1-60)
framerate = 15

# Video bitrate in kbps (64-16384)
#
# 1500, not 2000: at 2000 the encoder produced ~113 KB I-frames, which need ~129 ms to packetise
# and send against a 66 ms frame budget at 15 fps, and burst ~80 datagrams at the client in one
# syscall. Lowering the ceiling shrinks the I-frame, which is the dominant cost on both counts.
bitrate = 1500

# Video encoding (H264, H265, MJPEG)
encoding = "H264"

# GOP length (1-300): frames between I-frames.
#
# Applied by ak_venc_open only, so a change needs an onvif-rust restart. Note this changes
# how OFTEN the I-frame cost is paid, not how big it is -- see min_qp for the size lever.
gop_length = 50

# Video quality level (1-100)
quality = 80

# Quantiser floor passed to ak_venc_open (SDK range 20-25).
#
# THIS SETTING DOES NOTHING ON THIS HARDWARE. Measured on device: with min_qp = 25 the encoder
# still produced I-frames at QP 23, read out of the bitstream with
#   ffmpeg -bsf:v trace_headers   ->  SliceQP = 26 + pic_init_qp_minus26 + slice_qp_delta
# A floor that is honoured cannot be undercut. I-frame size was unchanged: 83.8 KB at 20 against
# 84.7 KB at 25.
#
# The value does reach ak_venc_open correctly -- it is the encoder that discards it. Left
# configurable because the SDK documents the field and another firmware may honour it.
# ak_venc_set_rc_weight is the knob that plausibly controls quality here, and is not wired up.
min_qp = 20

# Audio enabled for this profile (true/false)
audio_enabled = true

# Audio encoding (G711, G726, AAC)
audio_encoding = "G711"

# Audio bitrate in kbps (8-512)
audio_bitrate = 64

# Audio sample rate in Hz (8000-48000)
audio_sample_rate = 8000

# ============================================================================
# Stream Profile 2 (Sub Stream - Lower Quality)
# ============================================================================
[stream_profile_2]
# Enable this profile (required for profile to be loaded)
enabled = true

# Profile name
name = "Profile2"

# Video width (160-3840)
width = 640

# Video height (120-2160)
height = 480

# Frame rate (1-60)
framerate = 15

# Video bitrate in kbps (64-16384)
bitrate = 512

# Video encoding (H264, H265, MJPEG)
encoding = "H264"

# GOP length (1-300)
gop_length = 30

# Video quality level (1-100)
quality = 80

# Quantiser floor passed to ak_venc_open (SDK range 20-25).
#
# THIS SETTING DOES NOTHING ON THIS HARDWARE. Measured on device: with min_qp = 25 the encoder
# still produced I-frames at QP 23, read out of the bitstream with
#   ffmpeg -bsf:v trace_headers   ->  SliceQP = 26 + pic_init_qp_minus26 + slice_qp_delta
# A floor that is honoured cannot be undercut. I-frame size was unchanged: 83.8 KB at 20 against
# 84.7 KB at 25.
#
# The value does reach ak_venc_open correctly -- it is the encoder that discards it. Left
# configurable because the SDK documents the field and another firmware may honour it.
# ak_venc_set_rc_weight is the knob that plausibly controls quality here, and is not wired up.
min_qp = 20

# Audio enabled for this profile (true/false)
audio_enabled = false

# Audio encoding (G711, G726, AAC)
audio_encoding = "G711"

# Audio bitrate in kbps (8-512)
audio_bitrate = 64

# Audio sample rate in Hz (8000-48000)
audio_sample_rate = 8000

