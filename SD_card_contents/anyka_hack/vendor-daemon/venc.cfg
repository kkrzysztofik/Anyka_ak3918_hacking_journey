[INPUT]
Width      = 1920
Height     = 1080
Format = NV12

[OUTPUT]

[RATE_CONTROL]
FrameRate = 25
RateCtrlMode = VBR
BitRate = 500
SliceQP     = AUTO
MinQP = 28
MaxQP = 48
MaxBitRate = 1000

[GOP]
GopCtrlMode = DEFAULT_GOP
Gop.Length  = 50
Gop.NumB = 0
Gop.FreqIDR = 50

[SETTINGS]
Profile = AVC_MAIN
Level = 4.0
BitDepthLuma = 8
BitDepthChroma = 8
PicCbQpOffset  = 0
PicCrQpOffset  = 0
AspectRatio = ASPECT_RATIO_AUTO
ScalingList = DEFAULT
WaveFront = DISABLE
LoopFilter = ENABLE
LoopFilter.BetaOffset = -1
LoopFilter.TcOffset  = -1
QPCtrlMode = AUTO_QP
CuQpDeltaDepth = 0
LambdaCtrlMode = AUTO_LDA
CacheLevel2           = 288
Compression           = ENABLE

[RUN]
Loop = FALSE
MaxPicture   = 1
FirstPicture = 0
