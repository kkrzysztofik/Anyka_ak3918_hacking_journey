[package]
name = "streaming-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streaming library for RTSP and HTTP-FLV protocols, forked from xiu"
repository = "https://github.com/harlanc/xiu"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "sync",
  "macros",
  "time",
  "io-util",
  "fs",  # Added for async file I/O (Phase 1 optimization)
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Binary I/O
bytes = "1.12"
byteorder = "1.5"
rand = "0.10"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP/Web
http = "1.4.2"
axum = "0.8.9"
base64 = "0.23.0"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1", default-features = false, features = [
  "alloc",
  "raw_value",
  "std",
] }
serde_derive = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
indexmap = "2.14"
async-trait = "0.1"
md5 = "0.8"
subtle = "2.6"
portable-atomic = { version = "1.14", features = ["std"] }

# Network
socket2 = "0.6"

[dev-dependencies]
mockall = "0.15"
proptest = "1.11"
