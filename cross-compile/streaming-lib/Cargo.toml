[package]
name = "streaming-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streaming library for RTSP and HTTP-FLV protocols, forked from xiu"
repository = "https://github.com/harlanc/xiu"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.49", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "sync",
  "macros",
  "time",
  "io-util",
  "fs",  # Added for async file I/O (Phase 1 optimization)
] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
futures = "0.3"

# Binary I/O
bytes = "1.11"
byteorder = "1.5"
rand = "0.10"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP/Web
http = "1.4.0"
axum = "0.8.8"
base64 = "0.22.1"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1", default-features = false, features = [
  "alloc",
  "raw_value",
  "std",
] }
serde_derive = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
indexmap = "2.13"
lazy_static = "1.5"
async-trait = "0.1"
md5 = "0.8"
subtle = "2.6"
job_scheduler_ng = "2.4"
portable-atomic = { version = "1.13", features = ["std"] }
mockall = "0.14"

# Network
reqwest = { version = "0.13", features = ["native-tls-vendored", "query", "form"] }

# Note: openssl-src is patched at workspace root for uClibc ARM target support.

[dev-dependencies]
mockall = "0.14"
tokio-test = "0.4"
proptest = "1.10"
wiremock = "0.6"
