[workspace]
members = ["onvif-rust", "streaming-lib"]
resolver = "2"

# No [patch.crates-io] entries are needed: nothing in the graph pulls openssl-src
# any more (streaming-lib's unused `reqwest` dependency was the only path to it).
# If a native-tls-backed dependency returns, restore:
#   [patch.crates-io]
#   openssl-src = { path = "patches/openssl-src-300.2.3+3.2.1-full" }
# The patch and its setup.sh entry are still tracked under patches/.

# Release profile for all workspace members
# Phase 4 optimization: Changed from opt-level="z" to "3" for performance gains
# - "z" optimizes for size (minimal inlining, loop unrolling disabled)
# - "3" optimizes for speed (aggressive inlining, loop unrolling enabled)
# Trade-off: Binary grows ~100-200KB but CPU usage drops 5-10% on ARMv5TEJ
# Justification: 24MB target has room for larger binary, need FPS improvement
[profile.release]
opt-level = 3    # Changed from "z" - prioritize speed over size
lto = true
codegen-units = 1
strip = true

# Debug-enabled release build: `cargo build --profile release-debug`
# Same optimizations as release but retains line-table debug info for coredump analysis.
# Binary is ~500KB larger but allows GDB to resolve Rust frames.
[profile.release-debug]
inherits = "release"
strip = false
debug = 1  # Line tables only — sufficient for backtraces without full DWARF bloat
